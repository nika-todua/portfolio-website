<section class="relative flex flex-wrap justify-center items-start w-full skill_inner gap-7">
    @for (skills of skillobject; track $index){
        <div class="overflow-hidden cards">
            <p class="m-0 font w-fill text-center text-lg uppercase text-[var(--color-light-gray)]">{{skills.title}}</p>
            <ul class="relative grid skill_inner_ul gap-5 mt-4 grid-cols-2">
                @for (skillsitems of skills.skill; track $index){
                    <li class="flex gap-1 font md:gap-2 text-[var(--color-off-white)] text-lg">
                        <span class="relative flex items-center icon justify-content">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="var(--skill-ICON)" class="flex w-5 h-5 md:w-[26px] md:h-[26px]" viewBox="0 0 16 16">
                                <path d="M2.5 8a5.5 5.5 0 0 1 8.25-4.764.5.5 0 0 0 .5-.866A6.5 6.5 0 1 0 14.5 8a.5.5 0 0 0-1 0 5.5 5.5 0 1 1-11 0"/>
                                <path d="M15.354 3.354a.5.5 0 0 0-.708-.708L8 9.293 5.354 6.646a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0z"/>
                            </svg>
                        </span>
                        <span>{{skillsitems}}</span>
                    </li>
                }
            </ul>
        </div>
    }
</section>
