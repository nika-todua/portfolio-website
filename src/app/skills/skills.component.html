<div class="relative flex flex-wrap justify-center w-full skill_inner gap-7">

    <div class="overflow-hidden cards">
        <p class="m-0 font w-fill text-center text-lg">{{frontentText}}</p>
        <ul class="relative grid skill_inner_ul gap-5">
            <li class="flex gap-1 font md:gap-2" *ngFor="let frontend of arrayFrontend">
                <span class="relative flex items-center icon justify-content">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="#156cbd" class="flex md:w-[26px] md:h-[26px]" viewBox="0 0 16 16">
                        <path d="M2.5 8a5.5 5.5 0 0 1 8.25-4.764.5.5 0 0 0 .5-.866A6.5 6.5 0 1 0 14.5 8a.5.5 0 0 0-1 0 5.5 5.5 0 1 1-11 0"/>
                        <path d="M15.354 3.354a.5.5 0 0 0-.708-.708L8 9.293 5.354 6.646a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0z"/>
                    </svg>
                </span>
                {{frontend}}
            </li>
        </ul>
    </div>

    <div class="overflow-hidden cards">
        <p class="m-0 font w-fill text-center text-lg">{{toolsText}}</p>
        <ul class="relative grid skill_inner_ul gap-5">
            <li class="flex gap-1 font md:gap-2" *ngFor="let tool of arrayTools">
                <span class="relative flex items-center icon justify-content">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="#156cbd" class="flex md:w-[26px] md:h-[26px]" viewBox="0 0 16 16">
                        <path d="M2.5 8a5.5 5.5 0 0 1 8.25-4.764.5.5 0 0 0 .5-.866A6.5 6.5 0 1 0 14.5 8a.5.5 0 0 0-1 0 5.5 5.5 0 1 1-11 0"/>
                        <path d="M15.354 3.354a.5.5 0 0 0-.708-.708L8 9.293 5.354 6.646a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0z"/>
                    </svg>
                </span>
                {{tool}}
            </li>
        </ul>
    </div>

</div>
