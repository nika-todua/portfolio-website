<section class="project relative w-full flex flex-wrap flex-col" style="gap: 32px; padding-bottom: 14px;">
    <!-- პროექტების სორტირების Select -->
    <select id="project_sort" class="project_inner_sortintSelect font w-100" aria-label="Sort projects by">
        <option class="font" value="all" selected>{{text1}}</option>
        <option class="font" *ngFor="let sort of selectTexts" [value]="sort">{{sort}}</option>
    </select>

    <div class="project_card_cont relative w-full flex flex-wrap gap-2 justify-center items-start">

        <div class="project_card_item rounded-3xl flex flex-col gap-3 max-w-[452px]" *ngFor="let data of paginatedProjects()">
            <div class="img_box relative aspect-video rounded-xl overflow-hidden pointer-events-none" style="background-color: #0c161f;">
                <div class="loading absolute w-full h-full flex justify-center items-center pointer-events-none z-0">
                    <div class="newtons-cradle pointer-events-none">
                        <div class="newtons-cradle__dot pointer-events-none" *ngFor="let i of ['','','','']"></div>
                    </div>
                </div>

                <img class="absolute object-cover block z-40" style="top: 0; left: 0; width: 100%; height: 100%;" loading="lazy" [srcset]="data.image_mobile + ' 600w, ' + data.image_desktop + ' 800w'" [sizes]="'(min-width: 600px) 800px, 600px'" [src]="data.image_desktop" alt="Project banner image">
            </div>
            
            <div class="card_desc w-full">
                <h2 class="font title text-2xl" style="color: #b8b8b8;">{{data.title}}</h2>
                <div class="flex flex-wrap justify-between items-center gap-2">
                    <p class="font date" style="color: #b8b8b8;">{{text2}} {{data.date}}</p>
                    <button class="font card_btn cursor-pointer overflow-hidden" type="button" aria-label="project link btn">
                        <a [href]="data.link" rel="nofollow" target="_blank" class="flex w-full text-base sm:text-lg" style="padding: 8px 10px;">{{text3}}</a>
                    </button>
                </div>
            </div>
        </div>

        
    </div>
    

    <nav class="pagination relative flex justify-center items-center">
        <ul class="relative flex flex-row">
            <li class="overflow-hidden flex">
                <button type="button" aria-label="left btn" class="outline-none font text-xl cursor-pointer" style="border-radius: 10px 0 0 10px;" (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="m-auto pointer-events-none" width="24" height="24" viewBox="0 0 24 24"><path d="m4.431 12.822 13 9A1 1 0 0 0 19 21V3a1 1 0 0 0-1.569-.823l-13 9a1.003 1.003 0 0 0 0 1.645z"></path></svg>
                </button>
            </li>

            <li class="overflow-hidden flex justify-center items-center" *ngFor="let page of getPaginationRange()">
                <button type="button" aria-label="pagination number" class="outline-none font text-xl cursor-pointer" (click)="changePage(page)" [class.active]="currentPage === page"> {{ page }} </button>
            </li>

            <li class="overflow-hidden flex">
                <button type="button" aria-label="right btn" class="outline-none font text-xl cursor-pointer" style="border-radius: 0 10px 10px 0;" (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages" >
                    <svg xmlns="http://www.w3.org/2000/svg" class="m-auto pointer-events-none" width="24" height="24" viewBox="0 0 24 24"><path d="M5.536 21.886a1.004 1.004 0 0 0 1.033-.064l13-9a1 1 0 0 0 0-1.644l-13-9A1 1 0 0 0 5 3v18a1 1 0 0 0 .536.886z"></path></svg>
                </button>
            </li>
            
        </ul>
    </nav>
    
</section>
