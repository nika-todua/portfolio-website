<section class="relative w-full task_box">
    <nav class="relative flex items-center justify-between w-full rounded-lg task_box_wrapper p-[15px] max-w-[517px] m-auto">
        <button (click)="setActiveTab('project')" aria-label="task btn 1" type="button" class="font select-none cursor-pointer py-4 w-[48%] text-sm {{projectbtnClass}} btn" [disabled]="!componentShowHidden" style="color: var(--color-light-gray); font-weight: var(--font-Semi-Bold); border-radius: .375rem;">{{text1}}</button>
        <button (click)="setActiveTab('skill')" aria-label="task btn 2" type="button" class="font select-none cursor-pointer py-4 w-[48%] text-sm {{skillbtnClass}} btn" [disabled]="componentShowHidden" style="color: var(--color-light-gray); font-weight: var(--font-Semi-Bold); border-radius: .375rem;">{{text2}}</button>
    </nav>
</section>

<section class="relative flex w-full mt-[65px] min-h-[330px] max-h-max">
    @if (!componentShowHidden){
        <app-project class="relative flex w-full" [projectmessage]="messageArray"></app-project>
    } @else {
        <app-skills class="relative flex w-full"></app-skills>
    }
</section>
