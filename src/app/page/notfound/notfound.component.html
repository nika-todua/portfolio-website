<section class="relative m-auto notfound_inner pb-11" style="width: 90%; padding-top: 30px;  max-width: 831px;">
    <div class="relative mx-auto pointer-events-none img_box" style="background-color: transparent !important; max-width: 640px;">
        <img [src]="imgSrc" class="flex object-cover w-full h-full pointer-events-none select-none" loading="lazy" alt="404 error image">
    </div>
    <div class="flex flex-col items-center m-auto text-center text_cont justify-items-center">
        <h1 class="text-2xl font-bold font">{{text1}}</h1>
        <p class="mb-6 text-lg font">{{text2}}</p>
        <button class="text-base rounded-lg cursor-pointer font backhomeBtn sm:text-xl" (click)="clickback()">{{text3}}</button>
    </div>
</section>
