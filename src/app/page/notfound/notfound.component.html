<section class="relative m-auto pb-11 w-[90%] pt-[30px] max-w-[var(--conent-max-w)] h-[calc(100vh-72px-118px)] min-h-fit md:h-[calc(100vh-98px-118px)]">
  <div class="relative mx-auto pointer-events-none w-full max-w-[640px] bg-transparent">
    <img [src]="imgSrc" class="object-cover w-full h-full pointer-events-none select-none" loading="eager" alt="404 error image">
  </div>

  <div class="flex flex-col items-center m-auto text-center mt-[35px]">
    <h1 class="text-3xl font" style="color: var(--color-off-white); font-weight: var(--font-Semi-Bold);"> {{ text1 }} </h1>
    <p class="mb-6 mt-1 text-lg font" style="color: var(--color-light-gray); font-weight: var(--font-Medium);"> {{ text2 }} </p>
    <button class="text-base sm:text-lg rounded-lg cursor-pointer px-3 py-2 tracking-[2px] outline-none border-none font bg-[var(--yellow)] text-[var(--btn-text-color)] select-none hover:text-white"
            (click)="clickback()" style="font-weight: var(--font-Medium);">
      {{ text3 }}
    </button>
  </div>
</section>
