<section class="w-full relative">
    <ul class="w-full flex flex-wrap justify-center items-start gap-1.5 mx-auto my-0 max-w-[435px]">
        @for (item of elementArray; track $index) {
            <li class="flex flex-col items-center text-center justify-items-start max-w-[88px] w-max" aria-type="listitem" aria-hidden="true">
                <span class="flex items-center justify-center font number w-fit text-lg h-[30px]" style="color: var(--color-off-white); font-weight: var(--font-Medium);">{{item.number}}
                    <ng-container *ngIf="item.pluseSet">
                        <span class="plusText text-[26px] ml-0.5" style="color: var(--color-off-white);">&#43;</span>
                    </ng-container>
                </span>
                <p class="font text text-sm" style="color: var(--color-light-gray); font-weight: var(--font-Medium);">{{item.name}}</p>
            </li>
        }
    </ul>
</section>
